[project]
name = "lighthouse-ble"
version = "0.0.0"
description = "Async Bluetooth LE control of SteamVR Lighthouse base stations (Valve Index V2, HTC Vive V1)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "g4bri3lDev", email = "admin@g4bri3l.de" }]
keywords = ["lighthouse", "base-station", "valve-index", "htc-vive", "steamvr", "bluetooth", "ble", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = ["bleak>=1.0", "bleak-retry-connector>=4.0"]

[project.urls]
Homepage = "https://github.com/g4bri3lDev/lighthouse-ble"
Repository = "https://github.com/g4bri3lDev/lighthouse-ble"
Issues = "https://github.com/g4bri3lDev/lighthouse-ble/issues"

[project.scripts]
lighthouse-ble = "lighthouse_ble.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]
